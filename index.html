<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Music Finder</title>
<style>
  :root { --bg:#0f0f0f; --card:#181818; --line:#333; --ink:#e8e8e8; --dim:#8a8a8a; --accent:#22d3ee; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:6vh 16px 12vh; display:flex; justify-content:center; }
  .card { width:100%; max-width:400px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:18px; }
  h1 { margin:0 0 14px; font-size:15px; font-weight:600; letter-spacing:.2px; }
  h1 span { color:var(--dim); font-weight:400; }
  input#q { width:100%; padding:11px 12px; background:#242424; border:1px solid var(--line);
    border-radius:9px; color:var(--accent); font-weight:600; font-size:14px; outline:none; }
  input#q:focus { border-color:var(--accent); }
  #cat { display:none; margin:8px 0 0; font-size:12px; color:#c9a227; }
  .segs { display:flex; gap:6px; margin:14px 0 4px; }
  .seg { flex:1; padding:8px 0; text-align:center; background:#202020; border:1px solid var(--line);
    border-radius:9px; color:var(--dim); font-size:13px; cursor:pointer; user-select:none; }
  .seg:hover { color:var(--ink); }
  .seg.on { background:#0e2c33; border-color:var(--accent); color:var(--accent); font-weight:600; }
  .row { display:flex; align-items:center; gap:9px; padding:7px 2px; }
  .row input { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
  .row label { flex:1; cursor:pointer; }
  .row label .sub { color:var(--dim); font-weight:400; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .one { color:var(--dim); text-decoration:none; padding:0 4px; font-size:13px; }
  .one:hover { color:var(--accent); }
  .opt { display:flex; align-items:center; gap:9px; margin-top:12px; padding-top:12px;
    border-top:1px solid var(--line); }
  .opt.disabled { opacity:.45; }
  .opt .txt { flex:1; font-size:13px; }
  .opt .txt .sub2 { display:block; color:var(--dim); font-size:12px; }
  button#go { width:100%; margin-top:14px; padding:12px; background:var(--accent); border:0;
    border-radius:9px; color:#06232a; font-weight:700; font-size:14px; cursor:pointer; }
  button#go[disabled] { background:#2a2a2a; color:#666; cursor:not-allowed; }
  #status { margin:10px 0 0; font-size:12px; color:#4ade80; min-height:16px; }
  #blockwrap { display:none; margin-top:12px; padding:10px; background:#3a2a12;
    border:1px solid #7a5a22; border-radius:9px; }
  #blockwrap p { margin:0 0 8px; font-size:12px; }
  .fb { display:block; color:var(--accent); font-size:13px; padding:3px 0; }
  .hint { margin:14px 0 0; font-size:11px; color:#666; line-height:1.9; }
  kbd { background:#242424; border:1px solid var(--line); border-radius:4px; padding:1px 5px;
    font-size:10px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="mode">Music Finder</h1>

  <input id="q" placeholder="Artist - Album (Label)" autocomplete="off" spellcheck="false" />
  <p id="cat">🏷 looks like a catalogue number — shops will search it as-is</p>

  <div class="segs" id="segs"></div>
  <div id="rows"></div>

  <div class="opt" id="grpwrap">
    <input type="checkbox" id="grp" />
    <span class="txt">🗂 Group tabs<span class="sub2" id="grpsub"></span></span>
  </div>

  <button id="go">Search</button>
  <p id="status"></p>

  <div id="blockwrap">
    <p>⚠️ Chrome blocked some tabs. Click to open them:</p>
    <div id="fallback"></div>
  </div>

  <p class="hint">
    <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> switch set &middot;
    <kbd>Enter</kbd> search &middot;
    <kbd>&#8984;</kbd>+<kbd>Enter</kbd> everything &middot;
    <kbd>Esc</kbd> clear
  </p>
</div>

<script>
/* ==========================================================================
   PASTE YOUR REAL EXTENSION ID BELOW — the line marked with >>>
   Get it from chrome://extensions -> Details on "Music Finder Grouper".
   The address bar will end with ?options=THE_ID
   32 characters, letters a-p only, no digits.
   ========================================================================== */
var EXT_IDS = [
  "eealalcjpafalomikjopkapfcpiimbdj"        /* >>> replace this string <<< */
];

var P = "https://";
var E = encodeURIComponent;

/* ---------- query shaping -------------------------------------------------
   Different sites want different things. One shared cleaner was making the
   vinyl shops return nothing, so each platform now picks its own.
   raw()      full string, parentheses and all      (Google, YouTube)
   clean()    drops "(Label)"                       (Bandcamp, Discogs, streaming)
   terse()    drops "(Label)" and the " - "         (all five shops)
   pathSafe() terse, minus characters that would break a URL path (Deejay.de)
-------------------------------------------------------------------------- */
function raw(v)   { return v.trim(); }
function clean(v) { return v.replace(/\s*\([^)]*\)\s*/g, " ").replace(/\s+/g, " ").trim(); }
function terse(v) { return clean(v).replace(/\s+-\s+/g, " ").trim(); }
function pathSafe(v) { return terse(v).replace(/[\/?#]/g, " ").replace(/\s+/g, " ").trim(); }

/* Short, has letters AND digits, no " - " separator => probably a cat number,
   so send it to the shops untouched. Cheap heuristic, harmless when wrong. */
function isCat(v) {
  var s = v.trim();
  if (!s || s.length > 14) { return false; }
  if (s.indexOf(" - ") >= 0) { return false; }
  return /[a-z]/i.test(s) && /[0-9]/.test(s);
}

var PLATFORMS = {
  bn: { name:"Bandcamp", sub:"native", dot:"#1da0c3", url:function (v, c) {
        return P + "bandcamp.com/search?item_type=a&q=" + E(c ? raw(v) : clean(v)); } },
  bg: { name:"Bandcamp", sub:"via Google", dot:"#14778f", url:function (v) {
        return P + "www.google.com/search?q=" + E("site:bandcamp.com/album " + raw(v)); } },
  dc: { name:"Discogs", sub:"releases", dot:"#8f8f8f", url:function (v, c) {
        return P + "www.discogs.com/search/?type=release&q=" + E(c ? raw(v) : clean(v)); } },
  sc: { name:"SoundCloud", sub:"", dot:"#ff5500", url:function (v, c) {
        return P + "soundcloud.com/search?q=" + E(c ? raw(v) : clean(v)); } },
  sp: { name:"Spotify", sub:"", dot:"#1db954", url:function (v) {
        return P + "open.spotify.com/search/" + E(clean(v)); } },
  yt: { name:"YouTube", sub:"", dot:"#cc181e", url:function (v) {
        return P + "www.youtube.com/results?search_query=" + E(raw(v)); } },
  bp: { name:"Beatport", sub:"", dot:"#a4ff00", url:function (v, c) {
        return P + "www.beatport.com/search?q=" + E(c ? raw(v) : clean(v)); } },
  tx: { name:"Traxsource", sub:"", dot:"#00a0dc", url:function (v, c) {
        return P + "www.traxsource.com/search?term=" + E(c ? raw(v) : terse(v)); } },
  ju: { name:"Juno Records", sub:"vinyl", dot:"#f5a623", url:function (v, c) {
        return P + "www.juno.co.uk/search/?q%5Ball%5D%5B%5D=" + E(c ? raw(v) : terse(v))
             + "&hide_forthcoming=0"; } },
  dj: { name:"Deejay.de", sub:"", dot:"#e2001a", url:function (v, c) {
        /* path-based search: the query IS the path, there is no ?q= */
        return P + "www.deejay.de/" + E(c ? raw(v) : pathSafe(v)); } },
  hw: { name:"Hardwax", sub:"", dot:"#cccccc", url:function (v, c) {
        return P + "hardwax.com/?search=" + E(c ? raw(v) : terse(v)); } }
};

var INTENTS = {
  dig:    { label:"Dig",    emoji:"\u26CF", color:"cyan",   keys:["bn","bg","dc","sc"] },
  buy:    { label:"Buy",    emoji:"\uD83D\uDED2", color:"orange",
            keys:["bp","tx","ju","dj","hw"] },
  listen: { label:"Listen", emoji:"\u25B6", color:"green",  keys:["sp","yt"] }
};
var ORDER = ["dig", "buy", "listen"];

var box       = document.getElementById("q");
var segsEl    = document.getElementById("segs");
var rowsEl    = document.getElementById("rows");
var goEl      = document.getElementById("go");
var statusEl  = document.getElementById("status");
var modeEl    = document.getElementById("mode");
var catEl     = document.getElementById("cat");
var grp       = document.getElementById("grp");
var grpwrap   = document.getElementById("grpwrap");
var grpsub    = document.getElementById("grpsub");
var blockwrap = document.getElementById("blockwrap");
var fallback  = document.getElementById("fallback");

var params = new URLSearchParams(location.search);
var EXT_ID = null;
var extReady = false;
var wasBlurred = true;
var intent = "dig";
var statusTimer = null;

/* ---------- selection, remembered per intent ---------- */
function storeKey(k) { return "sel3_" + k; }

function stored(k) {
  var v = localStorage.getItem(storeKey(k));
  if (v === null) { return INTENTS[k].keys.slice(); }   /* first visit: all on */
  if (v === "") { return []; }
  return v.split(",").filter(function (x) { return INTENTS[k].keys.indexOf(x) >= 0; });
}

function selected() {
  var out = [];
  INTENTS[intent].keys.forEach(function (k) {
    var cb = document.getElementById("cb_" + k);
    if (cb && cb.checked) { out.push(k); }
  });
  return out;
}

function persist() { localStorage.setItem(storeKey(intent), selected().join(",")); }

/* ---------- rendering ---------- */
function renderSegs() {
  segsEl.innerHTML = "";
  ORDER.forEach(function (k) {
    var d = document.createElement("div");
    d.className = "seg" + (k === intent ? " on" : "");
    d.textContent = INTENTS[k].emoji + " " + INTENTS[k].label;
    d.onclick = function () { setIntent(k); };
    segsEl.appendChild(d);
  });
}

function renderRows() {
  var on = stored(intent);
  rowsEl.innerHTML = "";
  INTENTS[intent].keys.forEach(function (k) {
    var p = PLATFORMS[k];
    var row = document.createElement("div");
    row.className = "row";

    var cb = document.createElement("input");
    cb.type = "checkbox";
    cb.id = "cb_" + k;
    cb.checked = on.indexOf(k) >= 0;
    cb.onchange = function () { persist(); sync(); };

    var dot = document.createElement("span");
    dot.className = "dot";
    dot.style.background = p.dot;

    var lab = document.createElement("label");
    lab.htmlFor = "cb_" + k;
    lab.innerHTML = p.name + (p.sub ? ' <span class="sub">' + p.sub + "</span>" : "");

    var one = document.createElement("a");
    one.className = "one";
    one.textContent = "\u2197";
    one.href = "#";
    one.title = "Open only " + p.name;
    one.onclick = function (e) { e.preventDefault(); openOne(k); };

    row.appendChild(cb);
    row.appendChild(dot);
    row.appendChild(lab);
    row.appendChild(one);
    rowsEl.appendChild(row);
  });
}

function setIntent(k) {
  if (!INTENTS[k]) { return; }
  intent = k;
  localStorage.setItem("intent", k);
  renderSegs();
  renderRows();
  sync();
  box.focus();
}

function grouping() { return extReady && grp.checked; }

function sync() {
  var v = box.value.trim();
  var n = selected().length;
  catEl.style.display = isCat(v) ? "block" : "none";

  if (!n) { goEl.disabled = true; goEl.textContent = "Select at least one platform"; return; }
  if (!v) { goEl.disabled = true; goEl.textContent = "Type something to search"; return; }
  goEl.disabled = false;
  goEl.textContent = "Search " + INTENTS[intent].emoji + " " + INTENTS[intent].label
    + " (" + n + ")" + (grouping() ? " \u2192 group" : "");
}

function renderMode() {
  if (!extReady) {
    modeEl.innerHTML = "Music Finder <span>&middot; grouper <b>not installed</b></span>";
    grpsub.textContent = "extension not detected \u2014 results open as separate tabs";
    grpwrap.className = "opt disabled";
    grp.disabled = true;
  } else if (grp.checked) {
    modeEl.innerHTML = "Music Finder <span>&middot; tab grouping <b>active</b></span>";
    grpsub.textContent = "results land in one coloured group";
    grpwrap.className = "opt";
    grp.disabled = false;
  } else {
    modeEl.innerHTML = "Music Finder <span>&middot; tab grouping <b>paused</b></span>";
    grpsub.textContent = "tick to group results again";
    grpwrap.className = "opt";
    grp.disabled = false;
  }
  sync();
}

function say(msg) {
  statusEl.textContent = msg;
  if (statusTimer) { clearTimeout(statusTimer); }
  if (msg) { statusTimer = setTimeout(function () { statusEl.textContent = ""; }, 4000); }
}

/* ---------- extension detection ---------- */
function hasExtApi() {
  return typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage;
}

function setExt(id) {
  EXT_ID = id;
  extReady = !!id;
  renderMode();
}

function probe(i) {
  if (!hasExtApi() || i >= EXT_IDS.length) { setExt(null); return; }
  var id = EXT_IDS[i];
  try {
    chrome.runtime.sendMessage(id, { type: "ping" }, function (res) {
      if (!chrome.runtime.lastError && res && res.ok) { setExt(id); }
      else { probe(i + 1); }
    });
  } catch (e) { probe(i + 1); }
}

/* ---------- opening ---------- */
function showBlocked(urls) {
  fallback.innerHTML = "";
  urls.forEach(function (u) {
    var a = document.createElement("a");
    a.className = "fb";
    a.href = u;
    a.target = "_blank";
    a.rel = "noopener";
    try { a.textContent = "\u2192 " + new URL(u).hostname.replace(/^www\./, ""); }
    catch (e) { a.textContent = "\u2192 open"; }
    fallback.appendChild(a);
  });
  blockwrap.style.display = "block";
}

function openPlain(urls) {
  var blocked = [];
  urls.forEach(function (u) {
    var w = window.open(u, "_blank");
    if (!w) { blocked.push(u); }
  });
  if (blocked.length) { showBlocked(blocked); }
  else { say("Opened " + urls.length + " tab" + (urls.length > 1 ? "s" : "")); }
}

function fire(keys, title, color) {
  var v = box.value.trim();
  if (!v || !keys.length) { return; }
  var c = isCat(v);
  var urls = keys.map(function (k) { return PLATFORMS[k].url(v, c); });
  blockwrap.style.display = "none";

  if (grouping()) {
    chrome.runtime.sendMessage(EXT_ID,
      { type: "openGroup", urls: urls, title: title, color: color },
      function (res) {
        if (chrome.runtime.lastError || !res || !res.ok) { setExt(null); openPlain(urls); }
        else { say("Opened " + res.count + " tabs in a group"); }
      });
  } else {
    openPlain(urls);
  }
}

function openOne(k) {
  var v = box.value.trim();
  if (!v) { say("Type something first"); box.focus(); return; }
  window.open(PLATFORMS[k].url(v, isCat(v)), "_blank");
}

function runIntent() {
  var v = box.value.trim();
  if (!v) { box.focus(); return; }
  fire(selected(), INTENTS[intent].emoji + " " + v, INTENTS[intent].color);
}

function runAll() {
  var v = box.value.trim();
  if (!v) { box.focus(); return; }
  var keys = [];
  ORDER.forEach(function (k) {
    stored(k).forEach(function (p) { if (keys.indexOf(p) < 0) { keys.push(p); } });
  });
  fire(keys, "\uD83C\uDFA7 " + v, "purple");
}

/* ---------- input behaviour ---------- */
box.addEventListener("mousedown", function () { wasBlurred = document.activeElement !== box; });
box.addEventListener("mouseup", function (e) {
  if (wasBlurred) { e.preventDefault(); box.select(); }
});
box.addEventListener("focus", function () {
  if (wasBlurred) { setTimeout(function () { box.select(); }, 0); }
});
box.addEventListener("blur", function () { wasBlurred = true; });
box.addEventListener("input", sync);

goEl.onclick = runIntent;

grp.onchange = function () {
  localStorage.setItem("grp", grp.checked ? "1" : "0");
  renderMode();
};

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    if (e.metaKey || e.ctrlKey) { runAll(); } else { runIntent(); }
    return;
  }
  if (e.key === "Escape") {
    box.value = "";
    blockwrap.style.display = "none";
    say("");
    sync();
    box.focus();
    return;
  }
  if (document.activeElement !== box && (e.key === "1" || e.key === "2" || e.key === "3")) {
    setIntent(ORDER[Number(e.key) - 1]);
  }
});

/* ---------- boot ---------- */
(function init() {
  var qp = params.get("q");
  box.value = qp ? qp : "";

  var sp = params.get("s");
  var remembered = localStorage.getItem("intent");
  if (sp && INTENTS[sp]) { intent = sp; }
  else if (remembered && INTENTS[remembered]) { intent = remembered; }
  else { intent = "dig"; }

  var g = params.get("g");
  grp.checked = (g !== null) ? (g === "1") : (localStorage.getItem("grp") !== "0");

  renderSegs();
  renderRows();
  renderMode();
  box.focus();
  probe(0);
})();
</script>
</body>
</html>
